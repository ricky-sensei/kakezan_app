<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>かけざん爆弾しょうりはん</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="config-app" aria-label="ゲーム設定">
      <header class="config-title">
        <div class="title-small">ばくだん</div>
        <h1>かけざん <span>爆弾</span> しょりはん!</h1>
      </header>

      <div class="config-content">
        <div class="config-explosion" aria-hidden="true"></div>

        <form id="configForm" class="config-panel">
          <label class="config-row">
            <span>だん</span>
            <select name="dan" aria-label="出題する段">
              <option value="all">すべて</option>
              <option value="1">1のだん</option>
              <option value="2">2のだん</option>
              <option value="3">3のだん</option>
              <option value="4">4のだん</option>
              <option value="5">5のだん</option>
              <option value="6">6のだん</option>
              <option value="7">7のだん</option>
              <option value="8">8のだん</option>
              <option value="9">9のだん</option>
            </select>
          </label>

          <label class="config-row">
            <span>じかん</span>
            <select name="seconds" aria-label="制限時間">
              <option value="30">30びょう</option>
              <option value="60">60びょう</option>
              <option value="90">90びょう</option>
              <option value="120">120びょう</option>
            </select>
          </label>

          <label class="config-row">
            <span>もんだい</span>
            <select name="target" aria-label="出題数">
              <option value="10">10もん</option>
              <option value="20">20もん</option>
              <option value="30">30もん</option>
            </select>
          </label>

          <button class="start-button" type="submit">START</button>
        </form>
      </div>
    </main>

    <script>
      document.querySelector("#configForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const params = new URLSearchParams(formData);
        window.location.href = `./game.html?${params.toString()}`;
      });
    </script>
  </body>
</html>
